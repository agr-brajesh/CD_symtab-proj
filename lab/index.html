<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbol Table Lab - collision-resolution performance evaluation</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f9; --border:#d9e0ec; --text:#18212f; --muted:#5a6a82; --faint:#8a97ab;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-weak:#e4ecff; --ok:#17855a; --ok-weak:#dcf4e8; --bad:#c23a2e; --bad-weak:#fbe3e0;
  --warn:#a86a0a; --warn-weak:#fdf0d4; --probe:#e8a21f; --probe-weak:#fdf0d0; --hit:#17855a; --miss:#c23a2e; --cell:#f7f9fd; --cell-full:#dfe9ff; --cell-full-b:#9db8f0;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d121a; --surface:#151c28; --surface2:#1b2432; --border:#283347; --text:#e5e9f1; --muted:#98a6bc; --faint:#6a7890;
  --accent:#6f9cff; --accent-ink:#0b1220; --accent-weak:#1c2a4a; --ok:#47c08f; --ok-weak:#12342a; --bad:#ef7b6e; --bad-weak:#3a1a18;
  --warn:#e5b04f; --warn-weak:#38290e; --probe:#f0b43c; --probe-weak:#3a2d0c; --hit:#47c08f; --miss:#ef7b6e; --cell:#1a2231; --cell-full:#20345a; --cell-full-b:#3f6aa8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:17px} h3{font-size:14px;letter-spacing:.01em} h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0 0 8px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1} .gap{gap:16px} .col{display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}

/* ---------- header / tabs ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1480px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2457d6,#17becf);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.logo i{background:rgba(255,255,255,.9);border-radius:2px;display:block} .logo i:nth-child(2n){background:rgba(255,255,255,.35)}
.brand h1{font-size:16px} .brand small{display:block;color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 13px;border-radius:8px;font:600 13px var(--sans);cursor:pointer}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--accent-weak);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;font:600 12px var(--sans);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)} .seg button:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)} .pill.ok .dot{background:var(--ok)} .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.bad .dot{background:var(--bad)}
main{max-width:1480px;margin:0 auto;padding:18px 20px 60px}
.pane{display:none} .pane.active{display:block}
.intro{margin-bottom:14px} .intro h2{margin-bottom:4px} .intro p{color:var(--muted);max-width:980px}

/* ---------- layout / cards ---------- */
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.card+.card{margin-top:14px}
.card>h3:first-child,.card .card-h{margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
details.card>summary{cursor:pointer;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::before{content:"▸";color:var(--muted);transition:transform .15s} details.card[open]>summary::before{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:10px}
.stack>*+*{margin-top:14px}

/* ---------- form controls ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>label,.lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field .hint{font-size:11.5px;color:var(--faint);line-height:1.35}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font:13px var(--sans);outline:none;min-width:0}
input[type=number]{font-family:var(--mono)} textarea{font-family:var(--mono);font-size:12.5px;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer} .check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:8px;font:600 13px var(--sans);cursor:pointer;transition:filter .1s,transform .05s}
.btn:hover{filter:brightness(.97)} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--border))}
.btn.small{padding:4px 9px;font-size:12px} .btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);user-select:none}
.chip:hover{border-color:var(--faint)} .chip.on{background:var(--accent-weak);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.strat-list{display:grid;grid-template-columns:1fr;gap:3px}
.strat-list label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.strat-list label:hover{background:var(--surface2)} .strat-list input{margin:0;accent-color:var(--accent)}
.strat-list .tagk{margin-left:auto;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 9px;text-align:left;cursor:pointer;font:inherit;color:var(--text)}
.preset b{display:block;font-size:12.5px} .preset span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.preset:hover{border-color:var(--accent)} .preset.on{border-color:var(--accent);background:var(--accent-weak)}

/* ---------- stats / badges ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 18px var(--mono);letter-spacing:-.02em} .stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.best{border-color:var(--ok);background:var(--ok-weak)} .stat.worst{border-color:var(--bad);background:var(--bad-weak)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--ok-weak);color:var(--ok)} .badge.bad{background:var(--bad-weak);color:var(--bad)} .badge.warn{background:var(--warn-weak);color:var(--warn)} .badge.info{background:var(--accent-weak);color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:13px;flex-wrap:wrap}
.banner.ok{background:var(--ok-weak);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .banner.bad{background:var(--bad-weak);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .banner.warn{background:var(--warn-weak)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)} .progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.empty{padding:36px 14px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}

/* ---------- charts / tables ---------- */
.chart-box{position:relative;height:420px} .chart-box.tall{height:480px} .chart-box.short{height:300px}
.tablewrap{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:10px}
table.data{border-collapse:collapse;width:100%;font-size:12.5px}
table.data th,table.data td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child,table.data th.l,table.data td.l{text-align:left}
table.data thead th{position:sticky;top:0;background:var(--surface2);z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer}
table.data tbody tr:hover{background:var(--surface2)} table.data td{font-family:var(--mono)} table.data td.l{font-family:var(--sans)}
table.data tr.grp td{border-top:2px solid var(--border)}
td.h0{background:color-mix(in srgb,var(--ok) 18%,transparent)} td.h1{background:color-mix(in srgb,var(--ok) 8%,transparent)} td.h3{background:color-mix(in srgb,var(--bad) 8%,transparent)} td.h4{background:color-mix(in srgb,var(--bad) 20%,transparent)}
.metrics{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- visualiser ---------- */
.viz{display:flex;flex-direction:column;gap:8px}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{position:relative;width:96px;min-height:58px;border:1.5px solid var(--border);background:var(--cell);border-radius:9px;padding:5px 7px 6px;transition:border-color .15s,background .15s,box-shadow .15s,transform .15s}
.cell .ix{font:10.5px var(--mono);color:var(--faint)} .cell .nm{font:600 12.5px var(--mono);word-break:break-all;margin-top:2px;min-height:17px}
.cell.full{background:var(--cell-full);border-color:var(--cell-full-b)}
.cell.tomb{background:repeating-linear-gradient(135deg,var(--cell),var(--cell) 5px,var(--surface2) 5px,var(--surface2) 10px);border-style:dashed}
.cell.tomb .nm{color:var(--faint);font-style:italic;font-weight:400}
.cell .dist{position:absolute;top:4px;right:6px;font:10px var(--mono);color:var(--muted)}
.cell.wnd{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.probe-diff{border-color:var(--probe)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--probe) 30%,transparent);transform:translateY(-2px)}
.probe-match{border-color:var(--hit)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--hit) 30%,transparent);background:var(--ok-weak)!important}
.probe-empty{border-color:var(--miss)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--miss) 25%,transparent)}
.probe-tomb{border-color:var(--faint)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--faint) 30%,transparent)}
.probe-new{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.visited{outline:2px dotted color-mix(in srgb,var(--probe) 60%,transparent);outline-offset:1px}
.chainrow{display:flex;align-items:center;gap:6px;min-height:40px}
.chainrow .bk{width:58px;flex:none;border:1.5px solid var(--border);background:var(--cell);border-radius:8px;padding:4px 6px;font:11px var(--mono);color:var(--faint)}
.chainrow .bk.full{background:var(--cell-full);border-color:var(--cell-full-b);color:var(--text)}
.node{border:1.5px solid var(--cell-full-b);background:var(--cell-full);border-radius:8px;padding:4px 9px;font:600 12.5px var(--mono);position:relative;transition:all .15s}
.arrow{color:var(--faint);font-size:13px}
.treebox{border:1.5px dashed var(--accent);border-radius:9px;padding:4px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.treebox .tag{font:700 10px var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.sect{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 2px}
.bucketrow{display:flex;align-items:center;gap:8px}
.bucketrow .bk{width:40px;font:11px var(--mono);color:var(--faint)}
.cells.tight{gap:5px} .cells.tight .cell{width:92px}
.log{max-height:360px;overflow:auto;font-size:12.5px}
.logop{padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:var(--surface)}
.logop .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px;font-weight:700}
.logop ol{margin:4px 0 0;padding-left:22px;color:var(--muted)} .logop li{margin:1px 0} .logop li b{color:var(--text)}
.logop li.cur{color:var(--text);background:var(--probe-weak);border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid}
pre.src{margin:0;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:auto;font:12px/1.5 var(--mono);max-height:300px}
canvas.heat{width:100%;height:34px;border-radius:6px;border:1px solid var(--border);image-rendering:pixelated;display:block}
.kbd{font:600 11px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.guide h3{margin:18px 0 6px;font-size:15px} .guide ul{margin:4px 0 8px;padding-left:20px} .guide li{margin:2px 0}
.guide table{border-collapse:collapse;margin:6px 0 12px;font-size:13px} .guide th,.guide td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top} .guide th{background:var(--surface2)}
footer{max-width:1480px;margin:0 auto;padding:0 20px 30px;color:var(--faint);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:.95}

.hint{font-size:11.5px;color:var(--faint);line-height:1.35;margin-top:4px}
.runbar{position:sticky;top:64px;z-index:5}
@media(max-width:1000px){.runbar{position:static}}
.topbar-in{gap:14px}.tab{padding:7px 11px}.brand small{max-width:260px}

.hero{border-radius:22px;padding:34px 34px 30px;background:linear-gradient(135deg,#1c3f9e 0%,#2457d6 45%,#17a3be 100%);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}
.hero h2{font-size:30px;letter-spacing:-.02em;margin-bottom:8px;color:#fff} .hero p{max-width:760px;color:rgba(255,255,255,.88);font-size:15.5px;margin:0}
.hero .facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px} .hero .facts span{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 13px;font-size:12.5px;font-weight:600}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px} @media(max-width:900px){.cards3{grid-template-columns:1fr}}
.bigcard{text-align:left;cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow);font:inherit;color:var(--text);transition:transform .12s,border-color .12s}
.bigcard:hover{transform:translateY(-3px);border-color:var(--accent)} .bigcard .ic{font-size:30px;display:block;margin-bottom:8px} .bigcard b{font-size:17px;display:block;margin-bottom:4px} .bigcard span.d{color:var(--muted);font-size:13.5px;line-height:1.45;display:block}
.headline{background:var(--accent-weak);border-radius:10px;padding:9px 13px;font-size:14px;margin-bottom:4px}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1} .bar i{display:block;height:100%;border-radius:99px}

</style>
</head>

function hashMod(name, key, m) { HASHES[name].fn(key); return reduce(m); }

function isPrime(n) { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }

/* ------------------------------------------------------------------ strategies metadata */
const STRATEGIES = [
  { id: 0, name: 'Separate Chaining',        short: 'Chaining',   kind: 'classic', color: '#1f77b4', desc: 'Every bucket is a linked list; colliding keys are pushed onto the list.' },
  { id: 1, name: 'Linear Probing',           short: 'Linear',     kind: 'classic', color: '#d62728', desc: 'On a collision try the next slot (+1). Simple and cache friendly, but forms primary clusters.' },
  { id: 2, name: 'Quadratic Probing',        short: 'Quadratic',  kind: 'classic', color: '#ff7f0e', desc: 'Probe index + i^2. Breaks primary clustering; may not reach every slot once the table is more than half full.' },
  { id: 3, name: 'Double Hashing',           short: 'Double',     kind: 'classic', color: '#2ca02c', desc: 'Step size comes from a second hash, so different keys follow different probe paths.' },
  { id: 4, name: 'Robin Hood Hashing',       short: 'Robin Hood', kind: 'hybrid',  color: '#9467bd', desc: 'Linear probing where a key that is further from home steals the slot of a richer one; lookups stop early.' },
  { id: 5, name: 'H1: Chaining + Tree',      short: 'H1 Chain+Tree', kind: 'hybrid', color: '#17becf', desc: 'Chaining, but a chain longer than the treeify threshold becomes a red-black tree (O(log n) worst case).' },
  { id: 6, name: 'H2: Open Addr + Overflow', short: 'H2 Open+Overflow', kind: 'hybrid', color: '#8c564b', desc: 'Linear probing inside a bounded window; when the window is full the key spills to an overflow chain.' },
  { id: 7, name: 'H3: Cuckoo + Stash',       short: 'H3 Cuckoo+Stash', kind: 'hybrid', color: '#e377c2', desc: 'Two hash functions and multi-slot buckets; displaced keys are kicked to their other bucket; a small stash absorbs failures.' },
];
const STRAT_COUNT = STRATEGIES.length;

/* ------------------------------------------------------------------ options */
function normOpts(o) {
  o = o || {};
  const num = (v, d) => (v === undefined || v === null || Number.isNaN(+v)) ? d : +v;
  const treeify = Math.max(1, Math.floor(num(o.treeify, 8)));
  return {
    capacity: Math.max(1, Math.floor(num(o.capacity, 1031))),
    hash: typeof o.hash === 'object' && o.hash ? o.hash : (HASHES[o.hash] || HASHES.djb2),
    autoResize: o.autoResize !== false,
    maxLoad: num(o.maxLoad, 0.7),
    treeify, untreeify: Math.min(Math.max(0, Math.floor(num(o.untreeify, 4))), treeify),
    window: Math.max(1, Math.floor(num(o.window, 8))),
    bucket: Math.max(1, Math.floor(num(o.bucket, 4))),
    stash: Math.max(0, Math.floor(num(o.stash, 4))),
    maxkick: Math.max(1, Math.floor(num(o.maxkick, 200))),
  };
}

/* sizeof() values of the C++ structures on a 64-bit GCC build - used for the memory model */
const SZ = { symbol: 48, ptr: 8, node: 56, slot: 56, bucketH1: 24, treeEntry: 112 };

/* ------------------------------------------------------------------ base class */
class SymbolTable {
  constructor(o) {
    this.o = o; this.hf = o.hash.fn; this.autoResize = o.autoResize; this.maxLoad = o.maxLoad;
    this.stats = { inserts: 0, insertProbes: 0, maxInsertProbes: 0, lookups: 0, lookupProbes: 0, maxLookupProbes: 0,
                   lastProbes: 0, collisions: 0, resizes: 0, failed: 0 };
    this.tr = null;                           // when an array: the visualiser collects trace events here
  }
  hm(s, m) { this.hf(s); return reduce(m); }
  recI(p) { const st = this.stats; st.insertProbes += p; st.lastProbes = p; if (p > st.maxInsertProbes) st.maxInsertProbes = p; }
  recL(p) { const st = this.stats; st.lookups++; st.lookupProbes += p; st.lastProbes = p; if (p > st.maxLookupProbes) st.maxLookupProbes = p; }
  loadFactor() { return this.size() / this.capacity(); }
  ev(e) { this.tr.push(e); }
}

/* ============================ 1. Separate chaining ============================ */
class ChainingTable extends SymbolTable {
  constructor(o) { super(o); this.b = new Array(nextPrime(o.capacity)).fill(null); this.n = 0; }
  _grow() {
    const nb = new Array(nextPrime(this.b.length * 2)).fill(null);
    if (this.tr) this.ev({ k: 'resize', from: this.b.length, to: nb.length });
    for (let h of this.b) while (h) { const nx = h.next; const i = this.hm(h.s.name, nb.length); h.next = nb[i]; nb[i] = h; h = nx; }
    this.b = nb; this.stats.resizes++;
  }
  insert(s) {
    const st = this.stats; st.inserts++;
    let i = this.hm(s.name, this.b.length), p = 0;
    if (this.tr && !this.b[i]) this.ev({ k: 'bucket', i, r: 'empty' });
    for (let x = this.b[i]; x; x = x.next) {
      p++; const m = x.s.name === s.name;
      if (this.tr) this.ev({ k: 'node', i, j: p - 1, r: m ? 'match' : 'diff' });
      if (m) { x.s = s; this.recI(p); return INSERT_EXISTS; }
    }
    if (this.autoResize && (this.n + 1) / this.b.length > this.maxLoad) { this._grow(); i = this.hm(s.name, this.b.length); }
    if (this.b[i]) st.collisions++;
    if (this.tr) this.ev({ k: 'place', i, j: 0, note: 'pushed at the head of the chain' });
    this.b[i] = { s, next: this.b[i] }; this.n++; this.recI(p + 1); return INSERT_OK;
  }
  lookup(nm) {
    let p = 0; const i = this.hm(nm, this.b.length);
    if (this.tr && !this.b[i]) this.ev({ k: 'bucket', i, r: 'empty' });
    for (let x = this.b[i]; x; x = x.next) {
      p++; const m = x.s.name === nm;
      if (this.tr) this.ev({ k: 'node', i, j: p - 1, r: m ? 'match' : 'diff' });
      if (m) { this.recL(p); return x.s; }
    }
    this.recL(p); return null;
  }
  erase(nm) {
    const i = this.hm(nm, this.b.length); let prev = null, j = 0;
    if (this.tr && !this.b[i]) this.ev({ k: 'bucket', i, r: 'empty' });
    for (let x = this.b[i]; x; prev = x, x = x.next, j++) {
      const m = x.s.name === nm;
      if (this.tr) this.ev({ k: 'node', i, j, r: m ? 'match' : 'diff' });
      if (m) { if (prev) prev.next = x.next; else this.b[i] = x.next; this.n--; return true; }
    }
    return false;
  }
  size() { return this.n; }
  capacity() { return this.b.length; }
  memoryBytes() { return this.b.length * SZ.ptr + this.n * SZ.node; }
  snapshot() { return { type: 'chain', buckets: this.b.map(h => { const a = []; for (let x = h; x; x = x.next) a.push({ name: x.s.name }); return a; }) }; }
}

/* ======================= 2-4. Open addressing (linear / quadratic / double) ======================= */
const LINEAR = 0, QUADRATIC = 1, DOUBLE = 2;
const EMPTY = 0, FULL = 1, DEL = 2;
class OpenAddrTable extends SymbolTable {
  constructor(mode, o) {
    super(o); this.mode = mode; const c = nextPrime(o.capacity);
    this.st = new Uint8Array(c); this.sy = new Array(c).fill(null); this.used = 0; this.tomb = 0;
    this.maxLoad = Math.min(this.maxLoad, 0.98); this.h0 = 0; this.step = 1; this.p = 0;
  }
  _start(nm, c) { this.h0 = this.hm(nm, c); this.step = this.mode === DOUBLE ? 1 + fnv32(nm) % (c - 1) : 1; }
  _at(i, c) {
    if (this.mode === LINEAR) return (this.h0 + i) % c;
    if (this.mode === QUADRATIC) return (this.h0 + i * i) % c;
    return (this.h0 + i * this.step) % c;
  }
  _limit() { const c = this.st.length; return Math.min(Math.floor(this.maxLoad * c), c - 1); }
  _find(nm) {
    const c = this.st.length; this._start(nm, c); let p = 0;
    for (let i = 0; i < c; i++) {
      const k = this._at(i, c); p++; const s = this.st[k];
      if (this.tr) this.ev({ k: 'slot', i: k, j: i, r: s === EMPTY ? 'empty' : s === DEL ? 'tomb' : (this.sy[k].name === nm ? 'match' : 'diff') });
      if (s === EMPTY) break;
      if (s === FULL && this.sy[k].name === nm) { this.p = p; return k; }
    }
    this.p = p; return -1;
  }
  _rebuild(cap) {
    const nst = new Uint8Array(cap), nsy = new Array(cap).fill(null);
    for (let q = 0; q < this.st.length; q++) if (this.st[q] === FULL) {
      const sym = this.sy[q]; this._start(sym.name, cap); let ok = false;
      for (let i = 0; i < cap; i++) { const k = this._at(i, cap); if (nst[k] === EMPTY) { nst[k] = FULL; nsy[k] = sym; ok = true; break; } }
      if (!ok) return false;
    }
    this.st = nst; this.sy = nsy; this.tomb = 0; return true;
  }
  _regrow(cap) {
    const from = this.st.length; cap = nextPrime(cap);
    while (!this._rebuild(cap)) cap = nextPrime(cap * 2);
    if (this.tr) this.ev({ k: 'resize', from, to: cap });
    this.stats.resizes++;
  }
  _put(d, s, p, coll) {
    if (this.st[d] === DEL) this.tomb--;
    this.st[d] = FULL; this.sy[d] = s; this.used++; this.recI(p); if (coll) this.stats.collisions++;
    if (this.tr) this.ev({ k: 'place', i: d, note: 'stored here' });
    return INSERT_OK;
  }
  insert(s) {
    const stt = this.stats; stt.inserts++;
    if (this.autoResize) { if (this.used + this.tomb + 1 > this._limit()) this._regrow((this.used + 1) * 2 > this._limit() ? this.st.length * 2 : this.st.length); }
    else if (this.used >= this.st.length) { this.recI(this.st.length); stt.failed++; return INSERT_FAILED; }
    const c = this.st.length; this._start(s.name, c); let del = -1, p = 0, coll = false;
    for (let i = 0; i < c; i++) {
      const k = this._at(i, c); p++; const sl = this.st[k];
      if (this.tr) this.ev({ k: 'slot', i: k, j: i, r: sl === EMPTY ? 'empty' : sl === DEL ? 'tomb' : (this.sy[k].name === s.name ? 'match' : 'diff') });
      if (i === 0 && sl === FULL) coll = true;
      if (sl === DEL) { if (del < 0) del = k; continue; }
      if (sl === EMPTY) return this._put(del >= 0 ? del : k, s, p, coll);
      if (this.sy[k].name === s.name) { this.sy[k] = s; this.recI(p); return INSERT_EXISTS; }
    }
    if (del >= 0) return this._put(del, s, p, coll);
    if (this.autoResize) { this._regrow(c * 2); stt.inserts--; return this.insert(s); }
    this.recI(p); stt.failed++; return INSERT_FAILED;
  }
  lookup(nm) { const k = this._find(nm); this.recL(this.p); return k >= 0 ? this.sy[k] : null; }
  erase(nm) {
    const k = this._find(nm); if (k < 0) return false;
    this.st[k] = DEL; this.sy[k] = null; this.used--; this.tomb++;
    if (this.tr) this.ev({ k: 'tomb', i: k }); return true;
  }
  size() { return this.used; }
  capacity() { return this.st.length; }
  memoryBytes() { return this.st.length * SZ.slot; }
  snapshot() { return { type: 'slots', slots: Array.from(this.st, (s, i) => ({ s, name: s === FULL ? this.sy[i].name : null })) }; }
}

/* ======================= 5. Robin Hood ======================= */
class RobinHoodTable extends SymbolTable {
  constructor(o) { super(o); const c = nextPrime(o.capacity); this.dist = new Int32Array(c).fill(-1); this.sy = new Array(c).fill(null); this.n = 0; this.maxLoad = Math.min(this.maxLoad, 0.98); this.p = 0; }
  _put(cur) {
    const c = this.dist.length; let k = this.hm(cur.name, c), d = 0;
    for (;;) {
      if (this.dist[k] < 0) { this.sy[k] = cur; this.dist[k] = d; return; }
      if (this.dist[k] < d) { const ts = this.sy[k]; this.sy[k] = cur; cur = ts; const td = this.dist[k]; this.dist[k] = d; d = td; }
      k = (k + 1) % c; d++;

  }
  _regrow(cap) {
    const od = this.dist, os = this.sy; const nc = nextPrime(cap);
    if (this.tr) this.ev({ k: 'resize', from: od.length, to: nc });
    this.dist = new Int32Array(nc).fill(-1); this.sy = new Array(nc).fill(null);
    for (let i = 0; i < od.length; i++) if (od[i] >= 0) this._put(os[i]);
    this.stats.resizes++;
  }
  _find(nm) {
    const c = this.dist.length; let k = this.hm(nm, c), d = 0, p = 0;
    for (;;) {
      p++; const dk = this.dist[k];
      if (this.tr) this.ev({ k: 'slot', i: k, j: d, r: dk < 0 ? 'empty' : (this.sy[k].name === nm ? 'match' : 'diff'), dist: dk, myDist: d });
      if (dk < 0 || dk < d) { this.p = p; return -1; }
      if (this.sy[k].name === nm) { this.p = p; return k; }
      k = (k + 1) % c; d++; if (d > c) { this.p = p; return -1; }
    }
  }
  insert(s) {
    const stt = this.stats; stt.inserts++; let c = this.dist.length;
    if (this.autoResize) { if (this.n + 1 > Math.min(Math.floor(this.maxLoad * c), c - 1)) { this._regrow(c * 2); c = this.dist.length; } }
    else if (this.n >= c) { this.recI(c); stt.failed++; return INSERT_FAILED; }
    let cur = s, d = 0, k = this.hm(cur.name, c), p = 0, swapped = false; const coll = this.dist[k] >= 0;
    for (;;) {
      p++; const dk = this.dist[k];
      if (this.tr) this.ev({ k: 'slot', i: k, j: d, r: dk < 0 ? 'empty' : (this.sy[k].name === cur.name ? 'match' : 'diff'), dist: dk, myDist: d });
      if (dk < 0) { this.sy[k] = cur; this.dist[k] = d; if (this.tr) this.ev({ k: 'place', i: k, note: 'stored here (distance from home = ' + d + ')' }); break; }
      if (!swapped && dk === d && this.sy[k].name === cur.name) { this.sy[k] = s; this.recI(p); return INSERT_EXISTS; }
      if (dk < d) {
        if (this.tr) this.ev({ k: 'swap', i: k, name: this.sy[k].name, dist: dk, myDist: d });
        const ts = this.sy[k]; this.sy[k] = cur; cur = ts; this.dist[k] = d; d = dk; swapped = true;
      }
      k = (k + 1) % c; d++;
    }
    this.n++; this.recI(p); if (coll) stt.collisions++; return INSERT_OK;
  }
  lookup(nm) { const k = this._find(nm); this.recL(this.p); return k >= 0 ? this.sy[k] : null; }
  erase(nm) {
    const k = this._find(nm); if (k < 0) return false;
    const c = this.dist.length; let i = k;
    for (;;) {
      const nx = (i + 1) % c;
      if (this.dist[nx] <= 0) { this.dist[i] = -1; this.sy[i] = null; break; }
      this.sy[i] = this.sy[nx]; this.dist[i] = this.dist[nx] - 1; i = nx;
      if (this.tr) this.ev({ k: 'shift', i: nx });
    }
    this.n--; return true;
  }
  size() { return this.n; }
  capacity() { return this.dist.length; }
  memoryBytes() { return this.dist.length * SZ.slot; }
  snapshot() { return { type: 'slots', robin: true, slots: Array.from(this.dist, (d, i) => ({ s: d >= 0 ? FULL : EMPTY, name: d >= 0 ? this.sy[i].name : null, dist: d })) }; }
}

/* ======================= H1. Chaining + tree ======================= */
const cmpName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
const treeCost = sz => (sz + 1 <= 1 ? 0 : 32 - Math.clz32(sz));     // ceil(log2(sz + 1)) for integers
class ChainTreeTable extends SymbolTable {
  constructor(o) {
    super(o); this.TREEIFY = o.treeify; this.UNTREEIFY = o.untreeify;
    this.b = Array.from({ length: nextPrime(o.capacity) }, () => ({ head: null, len: 0, tree: null })); this.n = 0;
  }
  _sorted(tree) { return Array.from(tree.values()).sort(cmpName); }
  _treeify(k, i) {
    k.tree = new Map(); for (let x = k.head; x; x = x.next) k.tree.set(x.s.name, x.s);
    k.head = null; k.len = 0; if (this.tr) this.ev({ k: 'treeify', i });
  }
  _untreeify(k, i) {
    for (const s of this._sorted(k.tree)) { k.head = { s, next: k.head }; k.len++; }
    k.tree = null; if (this.tr) this.ev({ k: 'untreeify', i });
  }
  _add(k, s, i) {
    if (k.tree) { if (!k.tree.has(s.name)) k.tree.set(s.name, s); return; }
    k.head = { s, next: k.head };
    if (++k.len > this.TREEIFY) this._treeify(k, i);
  }
  _grow() {
    const all = [];
    for (const k of this.b) { if (k.tree) for (const s of this._sorted(k.tree)) all.push(s); for (let x = k.head; x; x = x.next) all.push(x.s); }
    const nb = nextPrime(this.b.length * 2);
    if (this.tr) this.ev({ k: 'resize', from: this.b.length, to: nb });
    this.b = Array.from({ length: nb }, () => ({ head: null, len: 0, tree: null }));
    for (const s of all) { const i = this.hm(s.name, nb); this._add(this.b[i], s, i); }
    this.stats.resizes++;
  }
  insert(s) {
    const st = this.stats; st.inserts++; let p = 0;
    let i = this.hm(s.name, this.b.length), k = this.b[i];
    if (k.tree) {
      p = treeCost(k.tree.size);
      const e = k.tree.get(s.name);
      if (this.tr) this.ev({ k: 'tree', i, j: p, size: k.tree.size, r: e ? 'match' : 'diff' });
      if (e) { k.tree.set(s.name, s); this.recI(p); return INSERT_EXISTS; }
    } else {
      if (this.tr && !k.head) this.ev({ k: 'bucket', i, r: 'empty' });
      for (let x = k.head, j = 0; x; x = x.next, j++) {
        p++; const m = x.s.name === s.name;
        if (this.tr) this.ev({ k: 'node', i, j, r: m ? 'match' : 'diff' });
        if (m) { x.s = s; this.recI(p); return INSERT_EXISTS; }
      }
    }
    if (this.autoResize && (this.n + 1) / this.b.length > this.maxLoad) { this._grow(); i = this.hm(s.name, this.b.length); k = this.b[i]; }
    if (k.tree ? k.tree.size > 0 : k.head !== null) st.collisions++;
    if (this.tr) this.ev({ k: 'place', i, note: k.tree ? 'inserted into the red-black tree' : 'pushed at the head of the chain' });
    this._add(k, s, i); this.n++; this.recI(p + 1); return INSERT_OK;
  }
  lookup(nm) {
    const i = this.hm(nm, this.b.length), k = this.b[i]; let p = 0;
    if (k.tree) {
      p = treeCost(k.tree.size); this.recL(p); const e = k.tree.get(nm);
      if (this.tr) this.ev({ k: 'tree', i, j: p, size: k.tree.size, r: e ? 'match' : 'diff' });
      return e || null;
    }
    if (this.tr && !k.head) this.ev({ k: 'bucket', i, r: 'empty' });
    for (let x = k.head, j = 0; x; x = x.next, j++) {
      p++; const m = x.s.name === nm;
      if (this.tr) this.ev({ k: 'node', i, j, r: m ? 'match' : 'diff' });
      if (m) { this.recL(p); return x.s; }
    }
    this.recL(p); return null;
  }
  erase(nm) {
    const i = this.hm(nm, this.b.length), k = this.b[i];
    if (k.tree) {
      if (this.tr) this.ev({ k: 'tree', i, j: treeCost(k.tree.size), size: k.tree.size, r: k.tree.has(nm) ? 'match' : 'diff' });
      if (!k.tree.delete(nm)) return false; this.n--;
      if (k.tree.size <= this.UNTREEIFY) this._untreeify(k, i); return true;
    }
    let prev = null;
    for (let x = k.head, j = 0; x; prev = x, x = x.next, j++) {
      const m = x.s.name === nm; if (this.tr) this.ev({ k: 'node', i, j, r: m ? 'match' : 'diff' });
      if (m) { if (prev) prev.next = x.next; else k.head = x.next; k.len--; this.n--; return true; }
    }
    return false;
  }
  size() { return this.n; }
  capacity() { return this.b.length; }
  memoryBytes() { let m = this.b.length * SZ.bucketH1; for (const k of this.b) { m += k.len * SZ.node; if (k.tree) m += k.tree.size * SZ.treeEntry; } return m; }
  snapshot() {
    return { type: 'chaintree', treeify: this.TREEIFY, buckets: this.b.map(k => {
      if (k.tree) return { tree: true, names: this._sorted(k.tree).map(s => ({ name: s.name })) };
      const a = []; for (let x = k.head; x; x = x.next) a.push({ name: x.s.name }); return { tree: false, names: a }; }) };
  }
}

/* ======================= H2. Open addressing + overflow chain ======================= */
class OpenOverflowTable extends SymbolTable {
  constructor(o) { super(o); this.L = o.window; this.maxLoad = Math.min(this.maxLoad, 0.98); this._init(nextPrime(o.capacity)); }
  _init(cap) { this.st = new Uint8Array(cap); this.sy = new Array(cap).fill(null); this.ov = new Array(Math.floor(cap / 4) + 1).fill(null); this.used = 0; this.tomb = 0; this.ovN = 0; }
  _win() { return Math.min(this.L, this.st.length); }
  _rawAdd(s) {
    const c = this.st.length; this.hf(s.name); const h0 = reduce(c), oi = reduce(this.ov.length);
    for (let i = 0; i < this._win(); i++) { const k = (h0 + i) % c; if (this.st[k] === EMPTY) { this.st[k] = FULL; this.sy[k] = s; this.used++; return; } }
    this.ov[oi] = { s, next: this.ov[oi] }; this.ovN++;
  }
  _rebuild(cap) {
    const all = [];

  'return short signed sizeof static struct switch typedef union unsigned void volatile while class public private protected new delete this ' +
  'true false null nullptr try catch throw namespace using template typename virtual override final import package interface extends implements ' +

<script>/* =============================================================================
   tests.js - "Tests" tab: prove in the browser that every strategy is correct
   ============================================================================= */
(function () {
'use strict';
const root = $('#pane-tests');
let ui = {}, running = false;

class Counter { constructor() { this.checks = 0; this.fails = []; } check(c, msg) { this.checks++; if (!c) this.fails.push(msg); } }
const sym = (n, line) => ({ name: n, type: 0, scope: 0, line: line || 0 });

/* ---------- 1. hash functions vs independent BigInt implementations ---------- */
function testHashes() {
  const c = new Counter(), M = (1n << 64n) - 1n, bytes = s => Array.from(s, ch => BigInt(ch.charCodeAt(0)));
  const ref = {
    djb2: s => { let x = 5381n; for (const b of bytes(s)) x = (x * 33n + b) & M; return x; },
    fnv1a: s => { let x = 0xcbf29ce484222325n; for (const b of bytes(s)) { x ^= b; x = (x * 0x100000001b3n) & M; } return x; },
    sdbm: s => { let x = 0n; for (const b of bytes(s)) x = (b + (x << 6n) + (x << 16n) - x) & M; return x; },
    pjw: s => { let x = 0n; for (const b of bytes(s)) { x = ((x << 4n) + b) & 0xffffffffn; const g = x & 0xF0000000n; if (g) x ^= g >> 24n; x &= ~g & 0xffffffffn; } return x; },
    sum: s => { let x = 0n; for (const b of bytes(s)) x += b; return x & M; },
  };
  const r = E.makeRng(99), ks = ['', 'a', 'abc', 'foobar', 'x'.repeat(40)]; for (let i = 0; i < 400; i++) ks.push(E.genIdent(r, 1, 45));
  for (const h of E.HASH_NAMES) for (const k of ks) {
    c.check(E.hashHex(h, k) === ref[h](k).toString(16).padStart(16, '0'), `${h}("${k}") differs from the BigInt reference`);
    c.check(E.hashMod(h, k, 10007) === Number(ref[h](k) % 10007n), `${h} mod 10007 of "${k}"`);
  }
  c.check(E.hashHex('fnv1a', 'a') === 'af63dc4c8601ec8c', 'FNV-1a 64-bit official test vector for "a"');
  c.check(E.hashHex('fnv1a', '') === 'cbf29ce484222325', 'FNV-1a 64-bit offset basis');
  c.check(E.hashHex('djb2', 'a') === (177670).toString(16).padStart(16, '0'), 'djb2("a") = 5381*33 + 97');
  c.check(E.hashHex('sum', 'abc') === E.hashHex('sum', 'cba'), 'sum hash is anagram-blind (intentionally weak)');
  return c;
}

function testEdges(sid) {

  c.check(t.insert(sym('alpha', 1)) === E.INSERT_OK, 'first insert');
  c.check(t.insert(sym('alpha', 2)) === E.INSERT_EXISTS, 'duplicate insert reports EXISTS');
  c.check(t.size() === 1, 'duplicate does not grow the table');
  const p = t.lookup('alpha'); c.check(p && p.line === 2, 'duplicate insert updates the stored symbol');
  c.check(t.erase('alpha') && !t.erase('alpha'), 'erase once, second erase fails');
  c.check(t.lookup('alpha') === null && t.size() === 0, 'deleted key is gone');
  c.check(t.insert(sym('alpha', 3)) === E.INSERT_OK && !!t.lookup('alpha'), 're-insert after delete');
  for (let i = 0; i < 2000; i++) t.insert(sym('id' + i));
  let all = true; for (let i = 0; i < 2000; i++) all = all && t.lookup('id' + i) !== null;
  c.check(all && t.size() === 2001, 'all keys survive repeated resizing (size = ' + t.size() + ')');
  c.check(t.stats.resizes > 0, 'the table resized at least once');
  c.check(t.loadFactor() <= 1.0, 'load factor stays ≤ 1 in auto-resize mode');
  t = E.createTable(sid, { capacity: 53, autoResize: false }); const cap = t.capacity(); let ok = 0, failed = 0; const placed = [];
  for (let i = 0; i < cap + 20; i++) { const k = 'v' + i, r = t.insert(sym(k)); if (r === E.INSERT_OK) { ok++; placed.push(k); } else if (r === E.INSERT_FAILED) failed++; }
  c.check(placed.every(k => t.lookup(k) !== null), 'fixed capacity: every accepted key is findable');
  c.check(t.size() === ok, `fixed capacity: size matches accepted inserts (${t.size()} vs ${ok})`);

  { l: 'extreme hybrid params', o: { capacity: 23, autoResize: true, treeify: 2, untreeify: 1, window: 1, bucket: 1, stash: 0, maxkick: 5 } },

async function testFuzz(sid, onOps) {
  const c = new Counter(); let ops = 0;
